name: Card Vault checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-vault-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check behavior and catalog
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.cjs
          for file in docs/*.js; do node --check "$file"; done
          python check_catalog.py
          python build_web.py
      - name: Check browser journeys and responsive layouts
        run: python tests/browser_movement.py
      - name: Save rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-vault-ui-${{ github.sha }}
          path: artifacts/movement/
